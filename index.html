<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>UpChat RN</title>
<style>
:root{--accent:#2AABEE;--bg:#0B141A;--bg2:#111B21;--surface:#1F2C34;--text:#E9EDEF;--text2:#8696A0;--bubble-me:#005C4B;--bubble-them:#1F2C34;--input:#2A3942;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
header.app{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--bg2)}
header.app h1{margin:0;font-size:1.4rem;font-weight:800}header.app p{margin:4px 0 0;color:var(--text2);font-size:.85rem}
.tabs{display:flex;border-top:1px solid var(--border);background:rgba(17,27,33,.95)}
.tabs button{flex:1;background:0;border:0;color:var(--text2);padding:12px 8px;font-size:.8rem;cursor:pointer}
.tabs button.active{color:var(--accent);font-weight:700}
.list{flex:1;overflow-y:auto;padding:8px 0}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.row:hover{background:var(--surface)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0}
.meta{flex:1;min-width:0}.meta .name{font-weight:600}.meta .preview{color:var(--text2);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--accent);color:#fff;border-radius:10px;padding:2px 7px;font-size:.75rem;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%}.dot.on{background:#25D366}.dot.off{background:#667781}
.btn{margin:12px 16px;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--accent);font-weight:700;cursor:pointer;width:calc(100% - 32px)}
.btn.primary{background:var(--accent);color:#fff;border:0}.btn.danger{color:#EF5350;border-color:#EF5350}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:82%;padding:8px 12px;border-radius:16px;font-size:.95rem;line-height:1.35}
.bubble.me{align-self:flex-end;background:var(--bubble-me)}.bubble.them{align-self:flex-start;background:var(--bubble-them);border:1px solid var(--border)}
.bubble time{display:block;text-align:right;font-size:.7rem;opacity:.7;margin-top:4px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--bg2)}
.composer input{flex:1;border:0;border-radius:22px;padding:12px 14px;background:var(--input);color:var(--text);font-size:1rem;outline:0}
.composer button{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:1.1rem}
.onboard{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px}
.logo{width:72px;height:72px;border-radius:22px;background:var(--accent);display:grid;place-items:center;font-size:2rem;font-weight:800;color:#fff;margin-bottom:16px}
.onboard h1{margin:0 0 8px;font-size:2rem}.onboard p{color:var(--text2);line-height:1.45}
.onboard input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:1rem;margin:16px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:20px;background:var(--input);border:0;color:var(--text);cursor:pointer;font-weight:600}
.chip.on{background:var(--accent);color:#fff}
.card{margin:16px;padding:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface)}
.empty{padding:40px 28px;color:var(--text2);line-height:1.5}
.back{background:0;border:0;color:var(--accent);font-size:1rem;cursor:pointer;margin-bottom:4px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const K={p:'upchat_rn_profile',c:'upchat_rn_convs',m:'upchat_rn_msgs',t:'upchat_rn_theme'};
const id=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const load=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const PEERS0=[{id:'peer_demo_1',name:'Amina',nearby:true},{id:'peer_demo_2',name:'Koffi',nearby:true},{id:'peer_demo_3',name:'Marie',nearby:false}];
let S={profile:load(K.p,null),conversations:load(K.c,[]),messages:load(K.m,{}),peers:PEERS0.map(p=>({...p})),theme:load(K.t,'dark'),tab:'chats',chat:null};
const themes={dark:{bg:'#0B141A',bg2:'#111B21',surface:'#1F2C34',text:'#E9EDEF',text2:'#8696A0',bubbleMe:'#005C4B',input:'#2A3942'},light:{bg:'#FFFFFF',bg2:'#F0F2F5',surface:'#FFFFFF',text:'#0B141A',text2:'#667781',bubbleMe:'#D0F0FD',input:'#F0F2F5'},oled:{bg:'#000',bg2:'#0A0A0A',surface:'#121212',text:'#E9EDEF',text2:'#8696A0',bubbleMe:'#004D40',input:'#1A1A1A'}};
function applyTheme(){const t=themes[S.theme]||themes.dark,r=document.documentElement.style;r.setProperty('--bg',t.bg);r.setProperty('--bg2',t.bg2);r.setProperty('--surface',t.surface);r.setProperty('--text',t.text);r.setProperty('--text2',t.text2);r.setProperty('--bubble-me',t.bubbleMe);r.setProperty('--input',t.input)}
function persist(){if(S.profile)save(K.p,S.profile);save(K.c,S.conversations);save(K.m,S.messages);save(K.t,S.theme)}
function getOrCreate(peerId,peerName){let c=S.conversations.find(x=>x.peerId===peerId);if(c)return c;c={id:'c_'+peerId,peerId,peerName,lastMessage:'',lastAt:'',unread:0,isNearby:S.peers.find(p=>p.id===peerId)?.nearby};S.conversations=[c,...S.conversations];persist();return c}
function sendMessage(conversationId,text){const trimmed=text.trim();if(!trimmed||!S.profile)return;const msg={id:id(),conversationId,content:trimmed,createdAt:new Date().toISOString(),isMe:true,status:'sent'};const list=(S.messages[conversationId]||[]).concat(msg);S.messages={...S.messages,[conversationId]:list};S.conversations=S.conversations.map(c=>c.id===conversationId?{...c,lastMessage:trimmed,lastAt:msg.createdAt}:c).sort((a,b)=>(b.lastAt||'').localeCompare(a.lastAt||''));persist();render();const conv=S.conversations.find(c=>c.id===conversationId);if(conv&&conv.isNearby)setTimeout(()=>{const reply={id:id(),conversationId,content:'✓ Reçu en local : « '+trimmed.slice(0,40)+(trimmed.length>40?'…':'')+' »',createdAt:new Date().toISOString(),isMe:false,status:'delivered'};const list2=(S.messages[conversationId]||[]).concat(reply);S.messages={...S.messages,[conversationId]:list2};S.conversations=S.conversations.map(c=>c.id===conversationId?{...c,lastMessage:reply.content,lastAt:reply.createdAt,unread:(S.chat&&S.chat.conversationId===conversationId)?0:c.unread+1}:c);persist();render()},1000)}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function timeStr(iso){if(!iso)return'';return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderOnboarding(root){root.innerHTML='';const s=el(`<div class="screen onboard"><div class="logo">U</div><h1>UpChat</h1><p>Messagerie locale d’abord. Aucun compte obligatoire. Tes données restent sur cet appareil.</p><label style="color:var(--text2);font-size:.85rem;font-weight:600">Choisis un pseudo</label><input id="name" placeholder="Ex. Alex" maxlength="32"/><button class="btn primary" id="go">Commencer</button><p style="font-size:.75rem;text-align:center;margin-top:16px">Identité locale · stockage navigateur</p></div>`);root.appendChild(s);s.querySelector('#go').onclick=()=>{const name=(s.querySelector('#name').value||'Utilisateur').trim();S.profile={userId:'u_'+id(),name,bio:'',createdAt:new Date().toISOString()};persist();render()}}
function renderChat(root){const{conversationId,peerName}=S.chat;const list=S.messages[conversationId]||[];root.innerHTML='';const s=el(`<div class="screen"><header class="app"><button class="back" id="back">← Retour</button><h1 style="font-size:1.15rem">${esc(peerName)}</h1></header><div class="chat-msgs" id="msgs"></div><div class="composer"><input id="input" placeholder="Message" maxlength="2000"/><button id="send">↑</button></div></div>`);root.appendChild(s);const msgs=s.querySelector('#msgs');list.forEach(m=>msgs.appendChild(el(`<div class="bubble ${m.isMe?'me':'them'}">${esc(m.content)}<time>${timeStr(m.createdAt)}${m.isMe?' · ✓':''}</time></div>`)));msgs.scrollTop=msgs.scrollHeight;s.querySelector('#back').onclick=()=>{S.chat=null;render()};const send=()=>{const input=s.querySelector('#input');const t=input.value;input.value='';sendMessage(conversationId,t)};s.querySelector('#send').onclick=send;s.querySelector('#input').onkeydown=e=>{if(e.key==='Enter')send()};S.conversations=S.conversations.map(c=>c.id===conversationId?{...c,unread:0}:c);persist()}
function renderMain(root){root.innerHTML='';const s=el(`<div class="screen"><div id="body" style="flex:1;min-height:0;display:flex;flex-direction:column"></div><nav class="tabs"><button data-tab="chats" class="${S.tab==='chats'?'active':''}">💬 Discussions</button><button data-tab="nearby" class="${S.tab==='nearby'?'active':''}">📡 Proximité</button><button data-tab="settings" class="${S.tab==='settings'?'active':''}">⚙️ Réglages</button></nav></div>`);root.appendChild(s);s.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.getAttribute('data-tab');render()});const body=s.querySelector('#body');
if(S.tab==='chats'){body.appendChild(el(`<header class="app"><h1>Discussions</h1><p>${esc(S.profile.name)}</p></header>`));const list=el('<div class="list"></div>');if(!S.conversations.length)list.appendChild(el(`<div class="empty"><strong style="color:var(--text)">Aucune discussion</strong><br/>Va dans Proximité pour démarrer.</div>`));else S.conversations.forEach(c=>{const row=el(`<div class="row"><div class="avatar">${esc(c.peerName.slice(0,1).toUpperCase())}</div><div class="meta"><div class="name">${esc(c.peerName)}</div><div class="preview">${esc(c.lastMessage||'Nouvelle discussion')}</div></div>${c.unread?`<span class="badge">${c.unread}</span>`:`<span style="color:var(--text2);font-size:.75rem">${timeStr(c.lastAt)}</span>`}</div>`);row.onclick=()=>{S.chat={conversationId:c.id,peerName:c.peerName,peerId:c.peerId};render()};list.appendChild(row)});body.appendChild(list)}
if(S.tab==='nearby'){body.appendChild(el(`<header class="app"><h1>Proximité</h1><p>Démo locale · pairs « à portée » répondent</p></header>`));const scan=el('<button class="btn" id="scan">Actualiser la découverte</button>');scan.onclick=()=>{S.peers=S.peers.map(p=>({...p,nearby:Math.random()>.3}));S.conversations=S.conversations.map(c=>({...c,isNearby:S.peers.find(p=>p.id===c.peerId)?.nearby}));persist();render()};body.appendChild(scan);const list=el('<div class="list"></div>');S.peers.forEach(p=>{const row=el(`<div class="row"><div class="dot ${p.nearby?'on':'off'}"></div><div class="meta"><div class="name">${esc(p.name)}</div><div class="preview">${p.nearby?'À portée (local)':'Hors de portée'}</div></div><span style="color:var(--accent);font-weight:600">Écrire</span></div>`);row.onclick=()=>{const c=getOrCreate(p.id,p.name);c.isNearby=p.nearby;S.chat={conversationId:c.id,peerName:p.name,peerId:p.id};render()};list.appendChild(row)});body.appendChild(list)}
if(S.tab==='settings'){body.appendChild(el(`<header class="app"><h1>Réglages</h1></header>`));body.appendChild(el(`<div class="card"><div style="color:var(--text2);font-size:.75rem;font-weight:700;text-transform:uppercase;margin-bottom:8px">Profil local</div><div style="font-weight:600">${esc(S.profile.name)}</div><div style="color:var(--text2);font-size:.8rem;margin-top:4px">ID : ${S.profile.userId.slice(0,18)}…</div></div>`));const card2=el(`<div class="card"><div style="color:var(--text2);font-size:.75rem;font-weight:700;text-transform:uppercase;margin-bottom:8px">Thème</div><div class="chips" id="themes"></div></div>`);[['dark','Sombre'],['light','Clair'],['oled','OLED']].forEach(([id,label])=>{const b=el(`<button class="chip ${S.theme===id?'on':''}">${label}</button>`);b.onclick=()=>{S.theme=id;persist();applyTheme();render()};card2.querySelector('#themes').appendChild(b)});body.appendChild(card2);body.appendChild(el(`<div class="card"><p style="margin:0;line-height:1.45">UpChat RN — offline-first. Démo Proximité simulée. BLE / maillage = phases suivantes.</p></div>`));const wipe=el('<button class="btn danger">Effacer les données locales</button>');wipe.onclick=()=>{if(!confirm('Effacer profil et messages ?'))return;localStorage.removeItem(K.p);localStorage.removeItem(K.c);localStorage.removeItem(K.m);S.profile=null;S.conversations=[];S.messages={};S.chat=null;render()};body.appendChild(wipe)}}
function render(){applyTheme();const root=document.getElementById('root');if(!S.profile)return renderOnboarding(root);if(S.chat)return renderChat(root);return renderMain(root)}
render();
})();
</script>
</body>
</html>
